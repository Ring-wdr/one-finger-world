name: Deploy online

# Manual: ships one commit to both halves of online play (docs/match-server-oracle.md §10).
#   1. typecheck + tests
#   2. match server (Oracle VM) first: it refuses clients whose protocol/data hash it does not know,
#      so it must already run the new code when the Worker starts handing out matches for it
#   3. D1 migrations, then the Worker (API, Lobby, static client)
#   4. both report the same data hash and the match server reports this commit
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   Worker + D1 deploys
#   MATCH_HOST          ubuntu@<vm ip>
#   MATCH_SSH_KEY       private key authorized on the VM (CI-only key)
#   MATCH_KNOWN_HOSTS   the VM's host key line (ssh-keyscan -t ed25519 <ip>), pinned
# Worker secrets (AUTH_SECRET, TICKET_SECRET, INTERNAL_SECRET) and the VM's /etc/ofa-match.env are set
# once by hand and persist; this workflow never touches them.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, match-server, worker]
        default: all

permissions:
  contents: read

# A deploy restarts running matches (they resume from a checkpoint), so never run two at once.
concurrency:
  group: online-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://one-finger-royale.akswnd55.workers.dev
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - name: SSH key for the match server
        if: inputs.target != 'worker'
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}
          MATCH_KNOWN_HOSTS: ${{ secrets.MATCH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MATCH_SSH_KEY" > ~/.ssh/ofa_match_ci
          chmod 600 ~/.ssh/ofa_match_ci
          printf '%s\n' "$MATCH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Deploy the match server
        if: inputs.target != 'worker'
        env:
          MATCH_HOST: ${{ secrets.MATCH_HOST }}
        run: bash apps/match-server/deploy/deploy.sh "$MATCH_HOST" ~/.ssh/ofa_match_ci

      # The Worker serves this build as static assets.
      - name: Build the client
        if: inputs.target != 'match-server'
        run: bun run build

      - name: Apply D1 migrations
        if: inputs.target != 'match-server'
        working-directory: apps/server
        run: bun x wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker
        if: inputs.target != 'match-server'
        working-directory: apps/server
        run: bun x wrangler deploy

      - name: Check both halves agree
        run: |
          origin=$(grep -oE '"MATCH_SERVER_ORIGIN": *"[^"]*"' apps/server/wrangler.jsonc | sed -E 's/.*"(wss?:[^"]*)"/\1/; s/^ws/http/')
          sha=$(git rev-parse --short=12 HEAD)
          worker=$(curl -fsS --retry 5 --retry-delay 3 "$WORKER_URL/api/health")
          match=$(curl -fsS --retry 5 --retry-delay 3 "$origin/health")
          echo "worker: $worker"
          echo "match:  $match"
          w_hash=$(echo "$worker" | jq -r .dataHash)
          m_hash=$(echo "$match" | jq -r .dataHash)
          [ "$w_hash" = "$m_hash" ] || { echo "::error::data hash differs: worker $w_hash, match server $m_hash"; exit 1; }
          if [ "${{ inputs.target }}" != worker ]; then
            [ "$(echo "$match" | jq -r .release)" = "$sha" ] || { echo "::error::match server is not on $sha"; exit 1; }
          fi
