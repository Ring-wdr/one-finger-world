name: Deploy to GitHub Pages

# Every push to main publishes the client to https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - id: pages
        uses: actions/configure-pages@v6

      # The site lives under the repo's subpath (e.g. /one-finger-world/), so built asset URLs
      # need it as their base. Models load relative to the page and follow along.
      - name: Build
        working-directory: apps/client
        env:
          # Empty keeps the Pages build offline-only; set the repository variable to reach the Worker.
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
        run: bun x vite build --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
