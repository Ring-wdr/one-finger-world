name: Deploy to Cloudflare

# Manual only: builds the client and deploys the Worker (API, Durable Objects, static assets) plus D1 migrations.
#
# The FIRST deploy must be done locally (docs/multiplayer-server-design.md §16.2): it creates the D1
# database and writes its id into apps/server/wrangler.jsonc, which this workflow needs (commit that
# change first). AUTH_SECRET is set once with `wrangler secret put AUTH_SECRET`, not by this workflow.
# Repository secrets required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

permissions:
  contents: read

# Deploys restart running matches (they resume from a checkpoint), so never run two at once.
concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      # The Worker serves this build as static assets.
      - run: bun run build

      - name: Apply D1 migrations
        working-directory: apps/server
        run: bunx wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker
        working-directory: apps/server
        run: bunx wrangler deploy
